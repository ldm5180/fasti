name = "fasti"
description = "SPARK-proven CBOE/NYSE trading-day calendar"
version = "0.1.0"

authors = ["Lenny Maiorani"]
maintainers = ["Lenny Maiorani <639247+ldm5180@users.noreply.github.com>"]
maintainers-logins = ["ldm5180"]
licenses = "MIT"
website = "https://github.com/ldm5180/fasti"
tags = ["calendar", "cboe", "nyse", "trading", "spark"]

project-files = ["fasti.gpr"]

[[depends-on]]
tempus = "*"
aunit = "^26.0.0"

#  tempus is not in the community index; pin it to an exact commit so a
#  build is reproducible from this file alone.  A consumer workspace must
#  pin the SAME commit -- alr 2.x refuses conflicting pin links -- so
#  bumping this is coordinated with the application repos (arb-ada).
#  tempus itself pins sml the same way; that link rides along, so this
#  crate never pins sml directly.
[[pins]]
tempus = { url = "https://github.com/ldm5180/tempus.git", commit = "25f7e396870b627d68afc10cd317ddbb5385621c" }

[build-switches]
"*".ada_version = "Ada2022"

#  `alr test` runs actions with an empty GPR_PROJECT_PATH, so each wraps its
#  command in `alr exec --` to pick up the toolchain, tempus and AUnit.
#  Argv-only actions (no `sh -c`, no `&&`) so this runs on Windows too; the
#  runner exits non-zero on any failing assertion, so a failure fails the
#  job.  The suite is built and run in both optimization modes (release -O3,
#  debug -O0), selected by the MODE external (sml-ada convention).
[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=release", "-P", "tests/test_fasti.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/test_runner"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=debug", "-P", "tests/test_fasti.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/test_runner"]
